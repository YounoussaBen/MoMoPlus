[project]
name = "project"
version = "0.1.0"
description = "A modern Django project template"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "python-decouple>=3.8",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.0",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "drf-spectacular>=0.27.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "django-celery-beat>=2.5.0",
    "django-celery-results>=2.5.0",
    "django-debug-toolbar>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "django-debug-toolbar>=4.2.0",
    "ipython>=8.0.0",
    "flower>=2.0.0",
    "pre-commit>=4.2.0",
    "types-redis>=4.6.0.20241004",
]
test = [
    "pytest>=8.4.1",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "coverage>=7.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.3.0",
]
prod = [
    "gunicorn>=21.0.0",
    "sentry-sdk>=1.32.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.tests"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=project",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80"
]
testpaths = ["project/apps"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 119
exclude = [".bzr", ".direnv", ".eggs", ".git", ".venv", "venv", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "W191", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["project"]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/tests/*",
    "manage.py",
    "*/settings/*",
    "*/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
