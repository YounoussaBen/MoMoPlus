repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs, djangorestframework-stubs, types-redis]
        args: [--ignore-missing-imports]
        files: ^project/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --directory backend --project backend --extra dev --extra test pytest
        language: system
        types: [python]
        pass_filenames: false
        args: [--disable-warnings, --maxfail=1, --cov-fail-under=80]
