<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project API</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
               color: white; margin: 0; padding: 0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; }
        .logo { font-size: 3rem; font-weight: bold; margin-bottom: 1rem; }
        .subtitle { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .link { background: rgba(255,255,255,0.2); padding: 0.8rem 1.5rem;
                border-radius: 8px; text-decoration: none; color: white;
                transition: all 0.3s ease; backdrop-filter: blur(10px); }
        .link:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .status { margin-top: 2rem; padding: 1rem; background: rgba(255,255,255,0.1);
                  border-radius: 8px; display: inline-block; }
        .status-dot { width: 10px; height: 10px; background: #4ade80;
                      border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀 Project API</div>
        <div class="subtitle">Django REST API</div>

        <div class="status">
            <span class="status-dot"></span>
            API Status: Online
        </div>
        <br>
        <br>
        <br>
        <br>
        <br>
        <div class="links">
            <a href="/api/docs/" class="link">📚 API Documentation</a>
            <a href="/api/redoc/" class="link">📖 ReDoc</a>
            <a href="/admin/" class="link">⚙️ Admin Panel</a>
            <a href="/api/status/" class="link">🔍 API Status</a>
        </div>

        <div style="margin-top: 3rem; opacity: 0.7;">
            <p>Version 1.0.0</p>
        </div>
    </div>
</body>
</html>
